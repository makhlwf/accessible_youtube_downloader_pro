name: Run Unit Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-suffix: unit-tests
      - run: uv python install
      - name: Install unit test dependencies without native wxPython
        run: uv sync --locked --no-install-package wxpython
      - name: Run mocked unit tests and platform import tests
        timeout-minutes: 10
        run: uv run --no-sync pytest tests/ -v -o faulthandler_timeout=60

  linux-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UV_CONCURRENT_BUILDS: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux compile and runtime dependencies
        run: sudo bash packaging/linux/install-deps.sh
      - uses: astral-sh/setup-uv@v10.1.0
        id: uv
        with:
          enable-cache: true
          save-cache: false
          cache-dependency-glob: |
            uv.lock
            .python-version
            packaging/linux/install-deps.sh
      - run: uv python install
      - name: Install native dependencies (first wxPython build can take 25 minutes)
        timeout-minutes: 45
        run: uv sync --locked
      - name: Save native build cache before smoke tests
        if: steps.uv.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: ${{ steps.uv.outputs.cache-key }}
      - name: Check real GTK, Prism and libmpv
        timeout-minutes: 2
        run: timeout --kill-after=10s 90s dbus-run-session -- xvfb-run -a uv run --no-sync python packaging/linux/runtime_smoke.py --packaging-smoke-test
      - name: Diagnose libmpv playback and wxGTK video embedding
        timeout-minutes: 4
        run: timeout --kill-after=10s 180s dbus-run-session -- xvfb-run -a uv run --no-sync python packaging/linux/mpv_player_diagnostics.py
