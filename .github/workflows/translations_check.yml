name: Translations Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check-translations:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --only-dev
      - run: uv run --no-sync python scripts/check_translations.py
