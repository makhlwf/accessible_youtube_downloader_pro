[project]
name = "accessible-youtube-downloader-pro"
version = "3.5.0"
description = "Accessible Windows YouTube browser, player, and downloader."
readme = "readme.md"
requires-python = ">=3.14"
license = "GPL-3.0-only"
authors = [{ name = "Makhlwf" }]
dependencies = [
    "beautifulsoup4==4.15.0",
    "httpx==0.28.1",
    "py-yt-search==0.7.2",
    "pyperclip==1.11.0",
    "requests==2.34.2",
    "wxpython==4.3.1",
]

[dependency-groups]
dev = [
    "babel==2.18.0",
    "pre-commit>=4.6.1,<5",
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",
    "ruff==0.16.0",
]
build = [
    "pyinstaller>=6.17.0,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
ignore = ["BLE001", "S110"]

[tool.ty.rules]
all = "ignore"


