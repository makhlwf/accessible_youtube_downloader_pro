name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type'
        required: true
        type: choice
        default: 'beta'
        options:
          - stable
          - beta
      version:
        description: 'Version Number (Required for Stable)'
        required: false
        type: string
      release_message:
        description: 'Release Message (Optional for Beta)'
        required: false
        type: string
      whats_new:
        description: "What's New (Required for Stable)"
        required: false
        type: string

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # NEW: Validate inputs based on logic GitHub UI can't handle
      - name: Validate Inputs
        shell: pwsh
        run: |
          $type = "${{ github.event.inputs.release_type }}"
          $ver = "${{ github.event.inputs.version }}"
          $msg = "${{ github.event.inputs.release_message }}"
          $news = "${{ github.event.inputs.whats_new }}"

          if ($type -eq 'stable') {
            if (-not $ver) { Write-Error "ERROR: 'Version' is required for Stable releases."; exit 1 }
            if (-not $msg) { Write-Error "ERROR: 'Release Message' is required for Stable releases."; exit 1 }
            if (-not $news) { Write-Error "ERROR: 'Whats New' is required for Stable releases."; exit 1 }
          }
          else {
            Write-Host "Beta release selected. Skipping strict input validation."
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      # NEW: Determine the version to use
      # If Stable: Use input. If Beta: Extract from source code.
      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.release_type }}" -eq "stable") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            # Extract version from application.py for Beta
            $content = Get-Content "source/application.py" -Raw
            if ($content -match 'version = "(.*?)"') {
                $version = $matches[1]
            } else {
                $version = "0.0.0-beta" # Fallback
            }
          }
          Write-Host "Using Version: $version"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Update version files (Stable only)
        if: ${{ github.event.inputs.release_type == 'stable' }}
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          
          # Update source/application.py
          (Get-Content "source/application.py") -replace 'version = ".*"', "version = `"$version`"" | Set-Content "source/application.py"
          
          # Update inno.iss
          (Get-Content "inno.iss") -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`"" | Set-Content "inno.iss"

      - name: Build Application
        run: python build.py

      - name: Update Inno Setup script for CI
        shell: pwsh
        run: |
          $innoContent = Get-Content "inno.iss" -Raw
          # Fix paths for CI environment
          $innoContent = $innoContent -replace 'Source: ".*\\dist\\HexPlayer.exe"', 'Source: "dist\HexPlayer\HexPlayer.exe"'
          $innoContent = $innoContent -replace 'Source: ".*\\dist\\_internal\\\*"', 'Source: "dist\HexPlayer\_internal\*"'
          $innoContent | Set-Content "inno_ci.iss"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Installer
        run: iscc "inno_ci.iss"

      - name: Handle Beta Release
        if: ${{ github.event.inputs.release_type == 'beta' }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing beta release/tag to keep it a "rolling" beta
          gh release delete beta --cleanup-tag -y 2>$null || Write-Host "No existing beta release to delete."

          $ver = "${{ steps.get_version.outputs.VERSION }}"
          $inputMsg = "${{ github.event.inputs.release_message }}"
          
          # Use input message if provided, otherwise default
          if (-not $inputMsg) { $inputMsg = "Automated Beta Build for version $ver" }

          $installerPath = "HexPlayer\HexPlayer.exe" # Ensure this path matches Output in Inno Script

          # Note: Inno Setup output usually goes to a specific folder defined in .iss (OutputBaseFilename)
          # Assuming Output is in root or Output folder. You might need to adjust path below:
          # If iscc outputs to 'Output' folder:
          if (Test-Path "Output\HexPlayer.exe") { $installerPath = "Output\HexPlayer.exe" }
          
          gh release create beta $installerPath `
            --title "Beta: $ver" `
            --notes "$inputMsg" `
            --prerelease `
            --target "${{ github.sha }}"

      - name: Handle Stable Release
        if: ${{ github.event.inputs.release_type == 'stable' }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ steps.get_version.outputs.VERSION }}"
          $tag = "v$ver"
          
          # Check for installer in Output folder (standard Inno Setup) or root
          $installerPath = "HexPlayer\HexPlayer.exe"
          if (Test-Path "Output\HexPlayer.exe") { $installerPath = "Output\HexPlayer.exe" }

          # Create GitHub Release
          gh release create $tag $installerPath `
            --title "Version $ver" `
            --notes "${{ github.event.inputs.release_message }}"

          # Direct download link construction
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/HexPlayer.exe"

          # Update update.json
          $updateJson = @{
            version = $ver
            url = $downloadUrl
            whats_new = "${{ github.event.inputs.whats_new }}"
          } | ConvertTo-Json -Compress
          $updateJson | Set-Content "update.json"

          # Update update_info.json (legacy)
          $updateInfoJson = @{
            version = $ver
            url = $downloadUrl
          } | ConvertTo-Json -Compress
          $updateInfoJson | Set-Content "update_info.json"

          # Commit changes
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source/application.py inno.iss update.json update_info.json
          git commit -m "Release version $ver"
          git push origin HEAD:${{ github.ref }}