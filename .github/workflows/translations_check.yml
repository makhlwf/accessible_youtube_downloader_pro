name: Translations Check

on: [push, pull_request]

jobs:
  check-translations:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install babel
    - name: Extract translations
      run: |
        pybabel extract -F babel.cfg -k _ -o messages.pot.tmp .
    - name: Compare POT files
      run: |
        # Ignore the creation date in the comparison
        grep -v "POT-Creation-Date" messages.pot > messages.pot.clean
        grep -v "POT-Creation-Date" messages.pot.tmp > messages.pot.tmp.clean
        diff messages.pot.clean messages.pot.tmp.clean || (echo "messages.pot is out of date. Please run 'pybabel extract -F babel.cfg -k _ -o messages.pot source/' and commit the changes." && exit 1)
