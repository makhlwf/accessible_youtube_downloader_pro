repos:
- repo: local
  hooks:
    - id: ruff-check
      name: Ruff check
      entry: uv run --locked ruff check --fix
      language: system
      types_or: [python, pyi]
      stages: [pre-commit]
    - id: ruff-format
      name: Ruff format
      entry: uv run --locked ruff format
      language: system
      types_or: [python, pyi]
      stages: [pre-commit]
    - id: ruff-check-ci
      name: Ruff check (CI)
      entry: uv run --locked ruff check .
      language: system
      pass_filenames: false
      stages: [pre-push]
    - id: ruff-format-ci
      name: Ruff format check (CI)
      entry: uv run --locked ruff format --check .
      language: system
      pass_filenames: false
      stages: [pre-push]
    - id: translations-check
      name: Translations template check
      entry: uv run --locked python scripts/check_translations.py
      language: system
      pass_filenames: false
      stages: [pre-push]
