name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release Type
        required: true
        type: choice
        default: beta
        options: [stable, beta]
      version:
        description: Version Number (Required for Stable)
        type: string
      release_message:
        description: Release Message (Required for Stable)
        type: string
      whats_new:
        description: What's New (Required for Stable)
        type: string
  workflow_call:
    inputs:
      release_type:
        type: string
        default: beta
      version:
        type: string
        default: ''
      release_message:
        type: string
        default: ''
      whats_new:
        type: string
        default: ''
    secrets:
      WINGET_TOKEN:
        required: false

concurrency:
  group: hexplayer-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate inputs and determine version
        id: version
        shell: pwsh
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          VERSION: ${{ inputs.version }}
          RELEASE_MESSAGE: ${{ inputs.release_message }}
          WHATS_NEW: ${{ inputs.whats_new }}
        run: |
          if ($env:RELEASE_TYPE -notin @('stable', 'beta')) { throw 'Invalid release type.' }
          if ($env:RELEASE_TYPE -eq 'stable') {
            if ('${{ github.ref_type }}' -ne 'branch') { throw 'Stable releases require a branch.' }
            if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Stable version must be X.Y.Z.' }
            if (-not $env:RELEASE_MESSAGE -or -not $env:WHATS_NEW) { throw 'Release Message and Whats New are required.' }
            $version = $env:VERSION
            $tag = "v$version"
            git rev-parse --verify "refs/tags/$tag" 2>$null
            if ($LASTEXITCODE -eq 0) { throw "Tag $tag already exists." }
            git fetch origin '${{ github.ref }}'
            if ($LASTEXITCODE -ne 0) { throw 'Could not fetch release branch.' }
            $remote = git rev-parse FETCH_HEAD
            $local = git rev-parse HEAD
            if ($remote -ne $local) { throw 'Branch advanced; dispatch a new release from its latest commit.' }
          } else {
            $content = Get-Content 'src/application.py' -Raw
            if ($content -notmatch 'version\s*=\s*"([^"]+)"') { throw 'Application version not found.' }
            $version = $matches[1]
            $tag = 'beta'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          exit 0
      - name: Bump version files and commit
        if: inputs.release_type == 'stable'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ver = $env:VERSION
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          $p = [System.IO.File]::ReadAllText('pyproject.toml')
          $p = $p -replace '(?m)^version\s*=\s*"[^"]*"', "version = `"$ver`""
          [System.IO.File]::WriteAllText('pyproject.toml', $p, $utf8)
          $u = [System.IO.File]::ReadAllText('uv.lock')
          $u = $u -replace '(?s)(\[\[package\]\]\r?\nname\s*=\s*"accessible-youtube-downloader-pro"\r?\nversion\s*=\s*)"[^"]+"', "`$1`"$ver`""
          [System.IO.File]::WriteAllText('uv.lock', $u, $utf8)
          $r = [System.IO.File]::ReadAllText('readme.md')
          $r = $r -replace 'The current application version is \*\*[^*]+\*\*', "The current application version is **$ver**"
          [System.IO.File]::WriteAllText('readme.md', $r, $utf8)
          $i = [System.IO.File]::ReadAllText('packaging/windows/inno.iss')
          $i = $i -replace '(?m)^#define MyAppVersion\s+"[^"]*"', "#define MyAppVersion `"$ver`""
          [System.IO.File]::WriteAllText('packaging/windows/inno.iss', $i, $utf8)
          $a = [System.IO.File]::ReadAllText('src/application.py')
          $a = $a -replace '(?m)^version\s*=\s*"[^"]*"', "version = `"$ver`""
          [System.IO.File]::WriteAllText('src/application.py', $a, $utf8)
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml uv.lock readme.md packaging/windows/inno.iss src/application.py
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'bumping version'
            if ($LASTEXITCODE -ne 0) { throw 'Version commit failed.' }
          }
          git push origin 'HEAD:${{ github.ref }}'
          if ($LASTEXITCODE -ne 0) { throw 'Version push failed.' }
      - name: Record exact build commit
        id: source
        shell: pwsh
        run: '"sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT'

  build:
    needs: prepare
    uses: ./.github/workflows/build-artifacts.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64
          path: artifacts/windows
      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64
          path: artifacts/linux
      - name: Publish all platform assets together
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_MESSAGE: ${{ inputs.release_message }}
        run: |
          set -euo pipefail
          test -s artifacts/windows/HexPlayer.exe
          test -s "artifacts/linux/HexPlayer-$VERSION-linux-x86_64.tar.gz"
          test -s "artifacts/linux/HexPlayer-$VERSION-linux-amd64.deb"
          (cd artifacts/linux && sha256sum --check ./*.sha256)
          if [ -z "$RELEASE_MESSAGE" ]; then
            RELEASE_MESSAGE="Automated Beta Build for version $VERSION ($SOURCE_SHA)"
          fi
          printf '%s\n' "$RELEASE_MESSAGE" > "$RUNNER_TEMP/release-notes.txt"
          if [ "$RELEASE_TYPE" = beta ]; then
            existing=$(gh release list --limit 1000 --json tagName --jq '.[] | select(.tagName == "beta") | .tagName')
            if [ "$existing" = beta ]; then
              gh release delete beta --cleanup-tag --yes
            else
              tag_exists=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/beta" --jq '.[] | select(.ref == "refs/tags/beta") | .ref')
              if [ -n "$tag_exists" ]; then
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/beta"
              fi
            fi
            gh release create "$TAG" artifacts/windows/HexPlayer.exe artifacts/linux/* \
              --target "$SOURCE_SHA" --title "Beta: $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.txt" --prerelease --latest=false --draft
          else
            gh release create "$TAG" artifacts/windows/HexPlayer.exe artifacts/linux/* \
              --target "$SOURCE_SHA" --title "Version $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.txt" --latest --draft
          fi
          gh release edit "$TAG" --draft=false
      - name: Update platform update metadata after publication
        if: inputs.release_type == 'stable'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          WHATS_NEW: ${{ inputs.whats_new }}
        run: |
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/HexPlayer.exe"
          $linuxUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/HexPlayer-$env:VERSION-linux-x86_64.tar.gz"
          $platforms = [ordered]@{
            windows = @{url=$url}
            linux = @{url=$linuxUrl}
          }
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          $update = [ordered]@{version=$env:VERSION; url=$url; whats_new=$env:WHATS_NEW; platforms=$platforms} | ConvertTo-Json -Depth 4
          $legacy = [ordered]@{version=$env:VERSION; url=$url; platforms=$platforms} | ConvertTo-Json -Depth 4 -Compress
          [System.IO.File]::WriteAllText('update.json', $update + "`n", $utf8)
          [System.IO.File]::WriteAllText('update_info.json', $legacy + "`n", $utf8)
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add update.json update_info.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'pushing update'
            if ($LASTEXITCODE -ne 0) { throw 'Update commit failed.' }
            git pull --rebase origin '${{ github.ref }}'
            if ($LASTEXITCODE -ne 0) { throw 'Release branch changed incompatibly.' }
            git push origin 'HEAD:${{ github.ref }}'
            if ($LASTEXITCODE -ne 0) { throw 'Update push failed.' }
          }
          exit 0

  publish-winget:
    needs: [prepare, publish]
    if: inputs.release_type == 'stable'
    uses: ./.github/workflows/winget.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.prepare.outputs.release_tag }}
      version: ${{ needs.prepare.outputs.version }}
